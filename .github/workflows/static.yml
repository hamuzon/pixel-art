# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll with GitHub Pages dependencies preinstalled

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Google Analytics 4
env:
  GA_MEASUREMENT_ID: G-F8HVYVW05H

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Inject GA4 and normalization script into HTML
        run: |
          sudo chown -R "$USER:$USER" ./_site
          cd ./_site

          find . -type f -name "*.html" ! -name "google*.html" \
            -exec perl -0pi -e '
              my @tags;
              if (index($_, "googletagmanager.com/gtag/js") == -1) {
                push @tags, qq~<!-- Google tag (gtag.js) -->
          <script async src="https://www.googletagmanager.com/gtag/js?id=$ENV{GA_MEASUREMENT_ID}"></script>
          <script>
          window.dataLayer = window.dataLayer || [];
          function gtag(){dataLayer.push(arguments);}
          gtag("js", new Date());
          gtag("config", "$ENV{GA_MEASUREMENT_ID}");
          </script>~;
              }
              if (index($_, "hostname.endsWith") == -1) {
                push @tags, q~<script>if(window.location.hostname.endsWith(".")){window.location.replace(window.location.href.replace(window.location.hostname,window.location.hostname.slice(0,-1)));}</script>~;
              }
              if (@tags) {
                my $insert = join "\n", @tags;
                s{(<head\b[^>]*>)}{$1\n$insert}i
                  or die "No <head> element found in $ARGV\n";
              }
            ' {} +

      - name: Remove sensitive files from deployment artifact
        run: |
          # デプロイ対象から削除
          cd ./_site
          rm -rf functions README.md README readme.md license LICENSE LICENSE.txt _redirects.md _redirects

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5